turns:
- What is the difference between stop_after_delay and stop_before_delay?
gold: Both are in tenacity/stop.py. stop_after_delay stops when seconds_since_start >= max_delay, which
  can overshoot a pending wait. stop_before_delay stops when seconds_since_start + upcoming_sleep >= max_delay,
  so the next sleep will not cross the limit.
